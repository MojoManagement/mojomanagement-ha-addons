name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    defaults:
      run:
        working-directory: yt-cast-audio-bridge/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: yt-cast-audio-bridge/app/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Home Assistant's Supervisor passes its own base image as BUILD_FROM and
      # starts the container with Docker's init. Build and run the same way.
      - name: Build add-on image the way the Supervisor does
        run: docker build --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:latest -t yt-cast-audio-bridge:ci yt-cast-audio-bridge
      - name: Start it and wait for the health check
        run: |
          docker run -d --init --name bridge -p 3099:3099 yt-cast-audio-bridge:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3099/healthz; then exit 0; fi
            sleep 2
          done
          docker logs bridge
          exit 1
