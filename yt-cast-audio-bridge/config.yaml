name: "YT Cast Audio Bridge"
version: "1.0.4"
slug: "yt_cast_audio_bridge"
description: "Cast YouTube and YouTube Music to speakers that only support Cast audio"
url: "https://github.com/MojoManagement/mojomanagement-ha-addons"
arch:
  - aarch64
  - amd64
startup: services
boot: auto
# Speakers and phones find the bridge via multicast (mDNS, SSDP); that needs the host network.
host_network: true
ingress: true
ingress_port: 3099
panel_icon: mdi:cast-audio
panel_title: "YT Cast Audio"
ports:
  3099/tcp: 3099
ports_description:
  3099/tcp: Status page (via Home Assistant) and health check
watchdog: "http://[HOST]:[PORT:3099]/healthz"
map:
  - type: addon_config
    read_only: true
options:
  bridge_name_prefix: "Audio ->"
  bridge_screen_prefix: "YouTube on"
  only_audio_like: true
  include_groups: true
  autoplay: true
  include_regex: ""
  exclude_regex: ""
  pinned_hosts: []
  max_receivers: 25
  offline_hide_after_ms: 180000
  dial_base_port: 3000
  dial_bind_to_addresses: []
  dial_bind_to_interfaces: []
  yt_dlp_auto_update: true
  yt_cookies_file: ""
  log_level: "INFO"
schema:
  bridge_name_prefix: str?
  bridge_screen_prefix: str?
  only_audio_like: bool
  include_groups: bool
  autoplay: bool
  include_regex: str?
  exclude_regex: str?
  pinned_hosts:
    - str?
  max_receivers: int(1,100)
  offline_hide_after_ms: int(10000,3600000)
  dial_base_port: int(1024,65000)
  dial_bind_to_addresses:
    - str?
  dial_bind_to_interfaces:
    - str?
  yt_dlp_auto_update: bool
  yt_cookies_file: str?
  log_level: list(DEBUG|INFO|WARN|ERROR)
